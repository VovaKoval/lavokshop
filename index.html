<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaVok Ultimate CRM — Instagram Integrated</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --primary: #4f46e5; --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0;
    --text: #0f172a; --text-light: #64748b; --danger: #ef4444; --success: #10b981;
  }
  * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); }
  
  /* Sidebar */
  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 260px; background: var(--card); border-right: 1px solid var(--border); padding: 20px; position: fixed; height: 100vh; }
  .nav-item { padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; font-weight: 500; color: var(--text-light); }
  .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
  
  /* Main */
  .main { margin-left: 260px; padding: 30px; width: 100%; }
  .view { display: none; }
  .view.active { display: block; }
  .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
  
  /* Tables */
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); color: var(--text-light); font-size: 12px; }
  td { padding: 12px; border-bottom: 1px solid var(--border); }

  /* Chat System */
  .chat-grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; height: 70vh; }
  .chat-list { overflow-y: auto; border-right: 1px solid var(--border); }
  .chat-item { padding: 15px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .chat-item:hover { background: #f1f5f9; }
  .bubble { padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; max-width: 70%; }
  .bubble.in { background: #e2e8f0; align-self: flex-start; }
  .bubble.out { background: var(--primary); color: white; align-self: flex-end; }
  
  /* Inputs */
  input, select { padding: 10px; border: 1px solid var(--border); border-radius: 6px; width: 100%; margin-bottom: 10px; }
  .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .btn-p { background: var(--primary); color: white; }
</style>
</head>
<body>

<div id="login-screen" style="height:100vh; display:flex; align-items:center; justify-content:center;">
    <div class="card" style="width:350px">
        <h2 style="margin-bottom:20px">LaVok CRM</h2>
        <input type="text" id="l-user" placeholder="Логін">
        <input type="password" id="l-pass" placeholder="Пароль">
        <button class="btn btn-p" style="width:100%" onclick="login()">Увійти</button>
    </div>
</div>

<div id="app" class="layout" style="display:none">
    <aside class="sidebar">
        <h2 style="color:var(--primary); margin-bottom:30px">LaVok Pro</h2>
        <div class="nav-item active" onclick="sv('dash', this)">📊 Дашборд</div>
        <div class="nav-item" onclick="sv('orders', this)">📦 Замовлення</div>
        <div class="nav-item" onclick="sv('chats', this)">💬 Instagram Чати</div>
        <div id="owner-menu">
            <div class="nav-item" onclick="sv('team', this)">👥 Команда (Менеджери)</div>
            <div class="nav-item" onclick="sv('stock', this)">🏠 Склад</div>
        </div>
        <div style="margin-top:auto; padding-top:20px">
            <b id="u-info"></b><br>
            <small onclick="location.reload()" style="color:var(--danger); cursor:pointer">Вийти</small>
        </div>
    </aside>

    <main class="main">
        <div id="v-dash" class="view active">
            <div class="card">
                <h3>Загальна аналітика</h3>
                <canvas id="myChart" height="100"></canvas>
            </div>
        </div>

        <div id="v-team" class="view">
            <div class="card">
                <div style="display:flex; justify-content:space-between">
                    <h3>Керування менеджерами</h3>
                    <button class="btn btn-p" onclick="addManager()">+ Додати менеджера</button>
                </div>
                <table>
                    <thead><tr><th>Ім'я</th><th>Логін</th><th>Пароль</th><th>Роль</th><th>Дії</th></tr></thead>
                    <tbody id="t-team"></tbody>
                </table>
            </div>
        </div>

        <div id="v-chats" class="view">
            <div class="card chat-grid">
                <div class="chat-list" id="chat-list"></div>
                <div style="display:flex; flex-direction:column">
                    <div id="active-chat-user" style="padding:10px; font-weight:700; border-bottom:1px solid var(--border)">Оберіть діалог</div>
                    <div id="chat-window" style="flex:1; padding:20px; overflow-y:auto; display:flex; flex-direction:column"></div>
                    <div style="padding:15px; display:flex; gap:10px">
                        <input type="text" id="chat-msg" style="margin:0" placeholder="Напишіть відповідь в Instagram...">
                        <button class="btn btn-p" onclick="replyMsg()">Відповісти</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="v-orders" class="view">
            <div class="card">
                <div style="display:flex; justify-content:space-between">
                    <h3>Замовлення</h3>
                    <button class="btn btn-p" onclick="newOrder()">➕ Новий продаж</button>
                </div>
                <table id="t-orders">
                    <thead><tr><th>Дата</th><th>Клієнт</th><th>Товар</th><th>Сума</th><th>Менеджер</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script>
let GAS_URL = "ВАШ_URL_СКРИПТА"; // Вставте сюди URL після публікації GAS
let db = { users: [], orders: [], messages: [], products: [] };
let currentUser = null;
let activeChatIndex = null;

// ФУНКЦІЯ ВХОДУ (Бере дані з Таблиці)
async function login() {
    const u = document.getElementById('l-user').value;
    const p = document.getElementById('l-pass').value;

    // Спершу вантажимо користувачів з Google
    const res = await fetch(GAS_URL + "?action=readAll");
    db = await res.json();

    const user = db.users.find(x => x.login == u && x.pass == p);
    
    if(user || (u === 'admin' && p === 'admin')) {
        currentUser = user || { name: "Власник", role: "admin" };
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        document.getElementById('u-info').innerText = currentUser.name;
        
        if(currentUser.role !== 'admin') {
            document.getElementById('owner-menu').style.display = 'none';
        }
        
        renderAll();
    } else {
        alert("Невірний логін або пароль!");
    }
}

// УПРАВЛІННЯ КОМАНДОЮ
function addManager() {
    const name = prompt("Ім'я менеджера:");
    const login = prompt("Логін:");
    const pass = prompt("Пароль:");
    if(name && login && pass) {
        db.users.push({ name, login, pass, role: 'manager' });
        save('users', 'Додав менеджера ' + name);
    }
}

async function save(sheet, log) {
    await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'write', sheet, data: db[sheet], logMsg: log })
    });
    renderAll();
}

// РЕНДЕРИНГ
function renderAll() {
    // Команда
    const tTeam = document.getElementById('t-team');
    if(tTeam) {
        tTeam.innerHTML = db.users.map((u, i) => `
            <tr><td>${u.name}</td><td>${u.login}</td><td>${u.pass}</td><td>${u.role}</td>
            <td><button onclick="del('users', ${i})">🗑️</button></td></tr>
        `).join('');
    }

    // Замовлення
    document.querySelector('#t-orders tbody').innerHTML = db.orders.map(o => `
        <tr><td>${o.date}</td><td>${o.client}</td><td>${o.item}</td><td>${o.sum} ₴</td><td>${o.manager}</td></tr>
    `).join('');

    // Чати Instagram
    const chatList = document.getElementById('chat-list');
    chatList.innerHTML = db.messages.map((m, i) => `
        <div class="chat-item" onclick="openChat(${i})">
            <b>${m.sender}</b><br><small>${m.text.substring(0,30)}...</small>
        </div>
    `).join('');
}

function openChat(i) {
    activeChatIndex = i;
    const m = db.messages[i];
    document.getElementById('active-chat-user').innerText = "Instagram: " + m.sender;
    document.getElementById('chat-window').innerHTML = `
        <div class="bubble in">${m.text}</div>
        ${m.reply ? `<div class="bubble out">${m.reply}</div>` : ''}
    `;
}

async function replyMsg() {
    const txt = document.getElementById('chat-msg').value;
    if(!txt || activeChatIndex === null) return;
    
    db.messages[activeChatIndex].reply = txt;
    db.messages[activeChatIndex].status = 'replied';
    
    // Тут в реальності ми б смикали Instagram Graph API для відправки
    await save('messages', 'Відповідь клієнту ' + db.messages[activeChatIndex].sender);
    document.getElementById('chat-msg').value = '';
    openChat(activeChatIndex);
}

function del(sheet, i) {
    if(confirm('Видалити?')) {
        db[sheet].splice(i, 1);
        save(sheet, 'Видалення з ' + sheet);
    }
}

function sv(id, el) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('v-' + id).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
}
</script>
</body>
</html>
