<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate CRM PRO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
body{font-family:Inter;background:#0f172a;color:white;margin:0}
.container{display:none;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:12px;margin-bottom:20px}
input,button{padding:10px;border-radius:8px;border:none}
button{background:#6366f1;color:white;cursor:pointer}
.admin-only{display:block}
body[data-role="manager"] .admin-only{display:none}
</style>
</head>
<body>

<div id="login">
  <h2>CRM Login</h2>
  <input id="user" placeholder="login"><br><br>
  <input id="pass" type="password" placeholder="password"><br><br>
  <button onclick="login()">Login</button>
</div>

<div class="container" id="app">

<h2 id="userName"></h2>

<div class="card">
  <h3>Дашборд</h3>
  <canvas id="chart"></canvas>
</div>

<div class="card">
  <h3>Замовлення</h3>
  <button onclick="addOrder()">+ Додати</button>
  <div id="orders"></div>
</div>

<div class="card">
  <h3>Склад</h3>
  <button onclick="addProduct()">+ Товар</button>
  <div id="products"></div>
</div>

<div class="card">
  <h3>Повідомлення</h3>
  <div id="messages"></div>
  <input id="msgText"><button onclick="sendMessage()">Send</button>
</div>

<div class="card admin-only">
  <h3>Адмін панель</h3>
  <button onclick="backup()">Backup</button>
  <button onclick="loadAll()">Reload</button>
</div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycb.../exec";

let db = {orders:[],products:[],messages:[],users:[],logs:[]};
let currentUser = null;

async function api(action,sheet,data=null){
  let res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:action,sheet:sheet,data:data})
  });
  return await res.json();
}

async function loadAll(){
  db.orders = (await api("read","orders")).data || [];
  db.products = (await api("read","products")).data || [];
  db.messages = (await api("read","messages")).data || [];
  db.users = (await api("read","users")).data || [];
  render();
}

async function save(sheet,data){
  await api("write",sheet,data);
}

function login(){
  const u=document.getElementById("user").value;
  const p=document.getElementById("pass").value;

  const user=db.users.find(x=>x.login===u && x.pass===p);
  if(!user){alert("Error");return;}

  currentUser=user;
  document.body.setAttribute("data-role",user.role);
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("userName").innerText=user.name;
}

function log(action){
  db.logs.push({user:currentUser.name,action,time:new Date().toISOString()});
  save("logs",db.logs);
}

function addOrder(){
  let name=prompt("Client");
  let sum=prompt("Sum");
  db.orders.push({name,sum,date:new Date().toISOString()});
  save("orders",db.orders);
  log("add order");
  render();
}

function addProduct(){
  let name=prompt("Name");
  let stock=prompt("Stock");
  db.products.push({name,stock});
  save("products",db.products);
  log("add product");
  render();
}

function sendMessage(){
  let text=document.getElementById("msgText").value;
  db.messages.push({text,user:currentUser.name});
  save("messages",db.messages);
  log("send message");
  render();
}

function render(){

  document.getElementById("orders").innerHTML = db.orders.map(o=>`<div>${o.name} - ${o.sum}</div>`).join("");
  document.getElementById("products").innerHTML = db.products.map(p=>`<div>${p.name} (${p.stock})</div>`).join("");
  document.getElementById("messages").innerHTML = db.messages.map(m=>`<div>${m.user}: ${m.text}</div>`).join("");

  new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{labels:db.orders.map(o=>o.name),datasets:[{data:db.orders.map(o=>o.sum)}]}
  });
}

async function backup(){
  await save("backup_"+Date.now(),[
    {db:JSON.stringify(db)}
  ]);
  alert("Backup done");
}

loadAll();

</script>
</body>
</html>
